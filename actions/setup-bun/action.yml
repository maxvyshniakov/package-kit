name: Set up Bun
description: >-
  Installs Bun, then runs bun install --frozen-lockfile with a token for the
  GitHub Packages registry.
inputs:
  bun-version:
    description: Bun to install.
    default: "1.4.4"
  install:
    description: Run bun install --frozen-lockfile after installing Bun.
    default: "true"
  token:
    description: GITHUB_TOKEN for bunfig.toml's @maxvyshniakov scope (read:packages).
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: ${{ inputs.bun-version }}
    - if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
